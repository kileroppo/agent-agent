name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'designs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'designs/**'

jobs:
  gates-and-lint:
    name: Gates & Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Architecture check
        run: npm run check:architecture
      - name: Gate doctor check
        run: npm run gate:doctor
      - name: Any density gate check
        run: npm run check:any-density

  types-and-frontend:
    name: Typecheck & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Full check (tsc + frontend build + typescript-ratio)
        run: npm run check
      - name: Frontend build drift check
        run: |
          npm run build:frontend --workspace=ajun-runtime
          git diff --exit-code apps/ajun-runtime/public/
          npm run build:frontend --workspace=project-progress-board
          git diff --exit-code apps/project-progress-board/public/
          npm run build:frontend --workspace=xiaod-media-transcriber
          git diff --exit-code apps/xiaod-media-transcriber/public/

  test-suite:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Run Core Tests
        run: npm run test:core
