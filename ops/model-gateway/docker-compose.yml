name: agent-army-model-gateway

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - litellm_postgres:/var/lib/postgresql/data
    networks: [gateway]

  gateway:
    image: ghcr.io/berriai/litellm-database:v1.94.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required}
      STEPFUN_UPSTREAM_API_KEY: ${STEPFUN_UPSTREAM_API_KEY:?STEPFUN_UPSTREAM_API_KEY is required}
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOG: INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./token_guard.py:/app/token_guard.py:ro
    networks: [gateway]

networks:
  gateway:
    driver: bridge

volumes:
  litellm_postgres:
    name: agent-army-litellm-postgres
