services:
  backend:
    build:
      context: ./backend
    environment:
      BOOM_DATA_DIR: /data
      BOOM_IMPORT_DIR: /data/import
      BOOM_PORT: 8000
      BOOM_ANALYSIS_AUTO_ENABLED: "false"
      BOOM_ANALYSIS_AUTO_GRADES: "T2,T3"
      BOOM_ANALYSIS_DAILY_LIMIT: "5"
      BOOM_ARMY_BASE_URL: "http://host.docker.internal:4321"
      BOOM_ARMY_BEARER_TOKEN: "${BOOM_MONITOR_BEARER_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - boom_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${BOOM_HTTP_PORT:-8081}:80"
    volumes:
      - ./frontend:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: python:3.12-slim
    volumes:
      - boom_data:/data
      - ./backup:/app/backup:ro
    working_dir: /app
    command: ["python", "/app/backup/backup.py"]
    restart: unless-stopped

volumes:
  boom_data:
  caddy_data:
  caddy_config:
