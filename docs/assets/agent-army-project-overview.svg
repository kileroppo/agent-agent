<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent军团项目一图介绍</title>
  <desc id="desc">展示用户从飞书提出目标，经 Hermes、A君、Paperclip 和专业岗位执行，最终形成可验证产物的数字员工系统。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#101A2D"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76E4F7"/>
      <stop offset="0.55" stop-color="#A9B7FF"/>
      <stop offset="1" stop-color="#F5A8FF"/>
    </linearGradient>
    <linearGradient id="delivery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123D39"/>
      <stop offset="1" stop-color="#102A35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7CDFF0"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7D8EAE"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 4px; fill: #7CE4F3; }
      .title-latin { font-size: 58px; font-weight: 760; fill: #79E2F3; letter-spacing: -1px; }
      .title-cn { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 58px; font-weight: 760; fill: #E8A5FA; letter-spacing: 1px; }
      .subtitle { font-size: 25px; font-weight: 450; fill: #B8C5D9; }
      .card-title { font-size: 28px; font-weight: 720; fill: #F5F8FF; }
      .card-kicker { font-size: 17px; font-weight: 680; letter-spacing: 2px; }
      .card-copy { font-size: 19px; font-weight: 430; fill: #B9C7DB; }
      .small { font-size: 17px; font-weight: 470; fill: #AEBBD0; }
      .pill { font-size: 16px; font-weight: 650; fill: #E9F1FF; }
      .lane-title { font-size: 22px; font-weight: 720; fill: #F1F5FF; }
      .lane-copy { font-size: 17px; font-weight: 430; fill: #B1BED2; }
      .footer-title { font-size: 27px; font-weight: 760; fill: #DFFDF5; }
      .footer-copy { font-size: 19px; font-weight: 500; fill: #BCE9DD; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1440" cy="50" r="250" fill="#7447FF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="90" cy="970" r="260" fill="#19C9B4" opacity="0.09" filter="url(#glow)"/>
  <path d="M0 185 H1600" stroke="#50617D" stroke-opacity="0.22"/>

  <!-- Header -->
  <text x="80" y="64" class="eyebrow">PROJECT OVERVIEW · 2026</text>
  <text x="80" y="127" class="title-latin">Agent</text>
  <text x="245" y="127" class="title-cn">军团</text>
  <text x="385" y="127" class="subtitle">把老板的一句话，变成可分工、可恢复、可验收的真实交付</text>
  <g transform="translate(1260 55)">
    <rect width="260" height="54" rx="27" fill="#17243B" stroke="#4A5A78"/>
    <circle cx="27" cy="27" r="7" fill="#7DE6C5"/>
    <text x="47" y="34" class="small" fill="#DDE8F8">本地优先 · 单组织部署</text>
  </g>

  <!-- Main flow labels -->
  <text x="80" y="230" class="card-kicker" fill="#7CE4F3">一条主工作流</text>
  <text x="244" y="230" class="small">日常入口与执行链保持简单，组织级工作才进入治理控制面</text>

  <!-- User card -->
  <g transform="translate(80 270)" filter="url(#shadow)">
    <rect width="210" height="190" rx="28" fill="#13233B" stroke="#3A5275" stroke-width="2"/>
    <circle cx="105" cy="58" r="31" fill="#203958"/>
    <circle cx="105" cy="48" r="12" fill="#8CE7F2"/>
    <path d="M80 82 C83 63 127 63 130 82" fill="#8CE7F2"/>
    <text x="105" y="126" text-anchor="middle" class="card-title">老板 / 团队</text>
    <text x="105" y="158" text-anchor="middle" class="card-copy">只需要说目标</text>
  </g>

  <!-- Feishu card -->
  <g transform="translate(340 270)" filter="url(#shadow)">
    <rect width="240" height="190" rx="28" fill="#251F3C" stroke="#715ED2" stroke-width="2"/>
    <rect x="28" y="26" width="49" height="49" rx="15" fill="#6D5BE7"/>
    <path d="M41 39 H65 M41 50 H59 M41 61 H55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="59" class="card-title">飞书</text>
    <text x="28" y="110" class="card-copy">日常派活 · 连续追问</text>
    <text x="28" y="141" class="card-copy">审批卡 · 最终交付</text>
    <text x="28" y="173" class="card-kicker" fill="#AFA2FF">军团的办公室</text>
  </g>

  <!-- Hermes card -->
  <g transform="translate(630 270)" filter="url(#shadow)">
    <rect width="270" height="190" rx="28" fill="#18283E" stroke="#5E8AC3" stroke-width="2"/>
    <circle cx="52" cy="50" r="24" fill="#284669"/>
    <path d="M38 53 C44 35 61 35 67 53 C61 67 44 67 38 53Z" fill="none" stroke="#86BDF5" stroke-width="3"/>
    <circle cx="52" cy="52" r="5" fill="#86BDF5"/>
    <text x="91" y="59" class="card-title">Hermes</text>
    <text x="28" y="110" class="card-copy">独立 Profile / Session</text>
    <text x="28" y="141" class="card-copy">记忆 · 模型 · 工具选择</text>
    <text x="28" y="173" class="card-kicker" fill="#8FC8FF">数字员工的运行时</text>
  </g>

  <!-- AJun card -->
  <g transform="translate(950 270)" filter="url(#shadow)">
    <rect width="280" height="190" rx="28" fill="#12333E" stroke="#36BCCA" stroke-width="2"/>
    <rect x="27" y="27" width="48" height="48" rx="15" fill="#1D6F7A"/>
    <path d="M39 52 H63 M51 40 V64" stroke="#9CF5F3" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="59" class="card-title">A君运行时</text>
    <text x="28" y="110" class="card-copy">本机能力 · 受控执行</text>
    <text x="28" y="141" class="card-copy">诊断 · 恢复 · 应急入口</text>
    <text x="28" y="173" class="card-kicker" fill="#79E4E7">不复制组织控制面</text>
  </g>

  <!-- Delivery card -->
  <g transform="translate(1280 270)" filter="url(#shadow)">
    <rect width="240" height="190" rx="28" fill="url(#delivery)" stroke="#4DD7B0" stroke-width="2"/>
    <circle cx="49" cy="51" r="24" fill="#1E6356"/>
    <path d="M38 51 L46 59 L62 42" fill="none" stroke="#B7FFE5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="59" class="card-title">可信交付</text>
    <text x="28" y="110" class="card-copy">真实产物 · 权限正确</text>
    <text x="28" y="141" class="card-copy">质量通过 · 可追溯</text>
    <text x="28" y="173" class="card-kicker" fill="#83E7C9">不是“模型说完成”</text>
  </g>

  <!-- Main arrows -->
  <path d="M290 365 H330" stroke="#7CDFF0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M580 365 H620" stroke="#7CDFF0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M900 365 H940" stroke="#7CDFF0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1230 365 H1270" stroke="#7CDFF0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="917" y="344" text-anchor="middle" class="pill">MCP</text>

  <!-- Paperclip governance rail -->
  <g transform="translate(420 500)" filter="url(#shadow)">
    <rect width="760" height="130" rx="28" fill="#16213A" stroke="#687BB8" stroke-width="2"/>
    <g transform="translate(28 27)">
      <rect width="78" height="76" rx="20" fill="#27365E"/>
      <circle cx="27" cy="27" r="9" fill="#A7B6FF"/>
      <circle cx="52" cy="27" r="9" fill="#A7B6FF"/>
      <circle cx="39" cy="51" r="9" fill="#A7B6FF"/>
      <path d="M27 36 L39 43 L52 36" stroke="#A7B6FF" stroke-width="3" fill="none"/>
    </g>
    <text x="132" y="52" class="card-title">Paperclip · 唯一组织级控制面</text>
    <text x="132" y="87" class="card-copy">组织 · 任务 · Run · 依赖 · 预算 · 审批 · 审计</text>
    <g transform="translate(575 25)">
      <rect width="155" height="34" rx="17" fill="#2A365E"/>
      <text x="77" y="23" text-anchor="middle" class="pill">跨员工 / 长任务</text>
      <rect y="48" width="155" height="34" rx="17" fill="#2A365E"/>
      <text x="77" y="71" text-anchor="middle" class="pill">扩权 / 付费 / 发布</text>
    </g>
  </g>
  <path d="M800 500 V476 H1090 V462" fill="none" stroke="#7D8EAE" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowMuted)"/>
  <text x="820" y="487" class="pill" fill="#AAB8D3">组织级工作才进入</text>

  <!-- Workforce -->
  <text x="80" y="694" class="card-kicker" fill="#7CE4F3">真实岗位编制</text>
  <text x="244" y="694" class="small">Manifest 定义职责、工具、数据范围、审批和质量门禁</text>

  <g transform="translate(80 725)">
    <rect width="450" height="145" rx="25" fill="#121F34" stroke="#3F5677"/>
    <circle cx="40" cy="42" r="13" fill="#54D9C0"/>
    <text x="65" y="50" class="lane-title">5 个常驻入口</text>
    <text x="28" y="88" class="lane-copy">A君 · 小D · 小R · 小办 · 运维官</text>
    <rect x="28" y="105" width="190" height="28" rx="14" fill="#163A3C"/>
    <text x="123" y="125" text-anchor="middle" class="pill">飞书 Gateway 常驻</text>
  </g>

  <g transform="translate(575 725)">
    <rect width="560" height="145" rx="25" fill="#121F34" stroke="#3F5677"/>
    <circle cx="40" cy="42" r="13" fill="#9A8DFF"/>
    <text x="65" y="50" class="lane-title">6 个后台按需岗位</text>
    <text x="28" y="88" class="lane-copy">创建官 · 审核官 · 架构师 · 技术专家 · 小拆 · 小创</text>
    <rect x="28" y="105" width="225" height="28" rx="14" fill="#2C2853"/>
    <text x="140" y="125" text-anchor="middle" class="pill">Paperclip / Hermes 唤醒</text>
  </g>

  <g transform="translate(1180 725)">
    <rect width="340" height="145" rx="25" fill="#121F34" stroke="#3F5677"/>
    <circle cx="40" cy="42" r="13" fill="#F5B66F"/>
    <text x="65" y="50" class="lane-title">1 个本机私密岗位</text>
    <text x="28" y="88" class="lane-copy">微信聊天取件员</text>
    <rect x="28" y="105" width="218" height="28" rx="14" fill="#49341F"/>
    <text x="137" y="125" text-anchor="middle" class="pill">原文不出 Mac · 不云降级</text>
  </g>

  <!-- Success definition footer -->
  <g transform="translate(80 905)">
    <rect width="1440" height="68" rx="24" fill="#10332F" stroke="#45BDA1" stroke-width="1.5"/>
    <text x="30" y="43" class="footer-title">真正完成 =</text>
    <text x="190" y="42" class="footer-copy">产物存在</text>
    <circle cx="305" cy="34" r="4" fill="#62DABB"/>
    <text x="329" y="42" class="footer-copy">可读取</text>
    <circle cx="425" cy="34" r="4" fill="#62DABB"/>
    <text x="449" y="42" class="footer-copy">权限正确</text>
    <circle cx="570" cy="34" r="4" fill="#62DABB"/>
    <text x="594" y="42" class="footer-copy">质量门禁通过</text>
    <circle cx="762" cy="34" r="4" fill="#62DABB"/>
    <text x="786" y="42" class="footer-copy">失败可恢复</text>
    <circle cx="920" cy="34" r="4" fill="#62DABB"/>
    <text x="944" y="42" class="footer-copy">全程可追溯</text>
    <g transform="translate(1193 13)">
      <rect width="220" height="42" rx="21" fill="#1E574D"/>
      <text x="110" y="28" text-anchor="middle" class="pill">M5 真实发布仍关闭</text>
    </g>
  </g>
</svg>
