<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M5 本地假平台发布验收</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { width: min(680px, calc(100% - 32px)); margin: 32px auto; }
    .card { background: #fff; border: 1px solid #d9e0e7; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px rgba(17, 24, 39, .08); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .notice { margin: 0 0 20px; padding: 12px; background: #eef6ff; border-radius: 10px; color: #164e78; }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input, textarea, button { box-sizing: border-box; width: 100%; font: inherit; }
    input, textarea { border: 1px solid #aeb9c5; border-radius: 9px; padding: 10px 12px; background: #fff; }
    textarea { min-height: 112px; resize: vertical; }
    button { margin-top: 20px; border: 0; border-radius: 10px; padding: 12px 16px; background: #0f62fe; color: #fff; font-weight: 700; cursor: pointer; }
    output { display: none; margin-top: 20px; padding: 14px; border-radius: 10px; background: #edf9f0; color: #185c2c; white-space: pre-wrap; }
    output[data-state="success"] { display: block; }
    .meta { margin: 6px 0 0; color: #5c6773; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">M5 本地假平台发布验收</h1>
      <p class="notice">这是本机测试页，不连接抖音或小红书，不读取 Cookie，不发送文件；仅在浏览器内读取测试文件的名称和大小。</p>
      <p class="meta" id="platform-label">平台：假抖音</p>
      <form id="publish-form">
        <label for="media">测试媒体文件</label>
        <input id="media" name="media" type="file" required>

        <label for="title">标题</label>
        <input id="title" name="title" maxlength="80" required>

        <label for="body">正文</label>
        <textarea id="body" name="body" maxlength="1200" required></textarea>

        <label for="tags">标签</label>
        <input id="tags" name="tags" value="#AI-Agent #本地验收" required>

        <label for="schedule">计划时间</label>
        <input id="schedule" name="schedule" value="2026-07-30 12:00" required>

        <button type="submit">生成本地假回执</button>
      </form>
      <output id="receipt" data-testid="fake-publish-receipt" role="status" aria-live="polite"></output>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const platform = params.get('platform') === 'fake-xiaohongshu'
        ? 'fake-xiaohongshu'
        : 'fake-douyin';
      document.querySelector('#platform-label').textContent =
        platform === 'fake-xiaohongshu' ? '平台：假小红书' : '平台：假抖音';

      const hashText = async (value) => {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest))
          .slice(0, 8)
          .map((byte) => byte.toString(16).padStart(2, '0'))
          .join('');
      };

      document.querySelector('#publish-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        if (!form.reportValidity()) return;
        const file = form.media.files[0];
        const title = form.title.value.trim();
        const body = form.body.value.trim();
        const tags = form.tags.value.trim();
        const schedule = form.schedule.value.trim();
        const digest = await hashText([platform, file.name, file.size, title, body, tags, schedule].join('|'));
        const receipt = document.querySelector('#receipt');
        receipt.dataset.state = 'success';
        receipt.dataset.contentId = `local-${platform}-${digest}`;
        receipt.textContent = [
          '本地假发布成功',
          `内容ID：${receipt.dataset.contentId}`,
          `文件：${file.name}（${file.size} bytes）`,
          `标题：${title}`,
          `计划时间：${schedule}`
        ].join('\n');
      });
    })();
  </script>
</body>
</html>
